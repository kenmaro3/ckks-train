[package]
name = "ckks-train-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RNS arithmetic, NTT and sampling primitives of ckks-train, an RNS-CKKS library for encrypted neural-network training"
readme = "README.md"
keywords = ["fhe", "rns", "ntt", "lattice", "homomorphic"]
categories = ["cryptography", "mathematics"]

[dependencies]
rand_chacha = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ntt"
harness = false
