[package]
name = "hekit-ckks"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "hekit-ckks (temporary name)"

[dependencies]
hekit-core = { path = "../hekit-core" }
ndarray = "0.16"
num-complex = "0.4"
rayon = { version = "1.10", optional = true }

[features]
# Data parallelism with rayon (src/par.rs). Off by default: results are bit-identical either
# way, and the default build keeps the single-threaded timings of M1 and M2.
parallel = ["dep:rayon"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rand_chacha = "0.9"
rand_core = "0.9"

[[bench]]
name = "rotate"
harness = false

[[bench]]
name = "bootstrap"
harness = false
required-features = ["parallel"]
