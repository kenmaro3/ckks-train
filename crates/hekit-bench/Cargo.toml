[package]
name = "hekit-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "hekit-bench (temporary name)"

[dependencies]
hekit-ckks = { path = "../hekit-ckks" }
hekit-core = { path = "../hekit-core" }
hekit-nn = { path = "../hekit-nn" }
ndarray = "0.16"
libc = "0.2"

[features]
# rayon data parallelism in hekit-ckks (bit-identical results; Task 41 runs label it).
parallel = ["hekit-ckks/parallel"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ckks_ops"
harness = false
