name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  research-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # These use archived inputs and synthetic temporary fixtures, not training runs.
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: bash -n scripts/run_all.sh && bash -n scripts/rename.sh
      - run: python3 tools/tables.py --check
      - run: python3 tools/figs.py --check
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features cuda -- -D warnings
  cuda-check:
    # The `cuda` feature (ckks-train-cuda) is compile-checked only: cudarc dlopens libcuda / libnvrtc
    # at run time, so no CUDA toolkit, driver or NVRTC is needed here. GPU tests are #[ignore]d
    # and run on quadruped-gpu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets --features cuda
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --workspace
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # licenses: allow-list in deny.toml; bans: tfhe* / concrete* (Zama) are forbidden.
          command: check licenses bans
