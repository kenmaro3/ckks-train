[workspace]
resolver = "3"
members = [
    "crates/hekit-core",
    "crates/hekit-ckks",
    "crates/hekit-nn",
    "crates/hekit-bench",
]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Later tasks run N = 2^16 tests; keep debug-assertions and overflow-checks (default for test).
[profile.test]
opt-level = 3
