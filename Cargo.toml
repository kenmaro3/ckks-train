[workspace]
resolver = "3"
members = [
    "crates/ckks-train-core",
    "crates/ckks-train-ckks",
    "crates/ckks-train-nn",
    "crates/ckks-train-bench",
    "crates/ckks-train-cuda",
]
exclude = ["spikes"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kenmaro3/ckks-train"

# Later tasks run N = 2^16 tests; keep debug-assertions and overflow-checks (default for test).
[profile.test]
opt-level = 3

# Same settings as the M0 NTT spike so bench numbers are comparable.
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
