[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "tfhe" },
    { crate = "concrete" },
    { crate = "concrete-core" },
    { crate = "concrete-ntt" },
    { crate = "concrete-fft" },
    { crate = "concrete-csprng" },
]
