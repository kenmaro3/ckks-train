[graph]
all-features = true

[licenses]
version = 2
# cargo-deny v2 has no explicit deny list: every license NOT in `allow` is rejected. That is how
# GPL-* (all versions, incl. LGPL/AGPL) and BSD-3-Clause-Clear are refused (project rule: MIT /
# Apache-2.0 / BSD only). Do not add them here.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC", # libloading (via cudarc, hekit-cuda); planner ruling 2026-11-05: ISC accepted (OSI, MIT-equivalent)
]
confidence-threshold = 0.8

# User-approved 2026-11-06: Unicode character-property tables only.
# Keep this package/version-specific; future dependency updates require review.
[[licenses.exceptions]]
name = "unicode-ident"
version = "=1.0.27"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
# Zama crates are banned outright (project rule), whatever their license.
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "tfhe" },
    { crate = "concrete" },
    { crate = "concrete-core" },
    { crate = "concrete-ntt" },
    { crate = "concrete-fft" },
    { crate = "concrete-csprng" },
    { crate = "tfhe-fft" },
    { crate = "tfhe-ntt" },
    { crate = "tfhe-cuda-backend" },
    { crate = "tfhe-zk-pok" },
    { crate = "tfhe-versionable" },
]
